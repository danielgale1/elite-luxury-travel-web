:root{
  --bg:#ffffff; --ink:#141414; --muted:#5e5e5e; --soft:#faf8f4; --line:#efebe3;
  --field:#d9d4ca; --gold:#c9a45c; --gold-ink:#8a6a2c;
  --serif:'Cormorant Garamond', Georgia, serif; --sans:Montserrat, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
a{color:var(--gold-ink)}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.main{flex:1;padding:calc(env(safe-area-inset-top) + 40px) 24px 120px}
.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-ink)}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.05}
.muted{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.rule{width:48px;height:1px;background:var(--gold);margin:22px 0}
.stack{display:flex;flex-direction:column;gap:12px}

/* Sign in */
.signin{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:80px 32px 48px;max-width:520px;margin:0 auto}
.mark{display:flex;flex-direction:column;align-items:center;gap:14px}
.monogram{width:64px;height:64px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;letter-spacing:2px;color:var(--gold-ink)}
.signin .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px 0}
.signin h1{font-size:44px}
label{font-size:13px;font-weight:500}
input,textarea,select{width:100%;min-height:54px;padding:14px 16px;border:1px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);font:16px var(--sans)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field)}
.btn[disabled]{opacity:.6;cursor:default}
.note{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
.error{color:#a12c2c;font-size:14px}

/* Day list */
.days{display:flex;flex-direction:column}
.day-row{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.day-num{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px}
.day-text{display:flex;flex-direction:column;gap:3px;flex:1}
.day-city{font-size:12px;color:var(--gold-ink)}
.day-title{font-size:15px;font-weight:500}
.chev{color:#9a9a9a}

/* Day detail */
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:12px}
.day-body{font-size:16px;line-height:1.65;color:#3d3d3d;margin:0}
.facts{border:1px solid var(--line);border-radius:16px;background:var(--soft);margin:22px 0}
.fact{display:flex;flex-direction:column;gap:4px;padding:16px 18px}
.fact + .fact{border-top:1px solid var(--line)}
.fact span:first-child{font-size:12px;color:#6b6b6b}
.fact span:last-child{font-size:15px;font-weight:500}
.pager{display:flex;gap:10px}
.pager .btn{font-size:14px;font-weight:500}

/* Pay */
.paycard{display:flex;flex-direction:column;gap:18px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--soft);margin-top:24px}
.amount{font-family:var(--serif);font-size:40px;line-height:1}

/* Trips list */
.trip-card{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink)}
.trip-card h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 10px)}
.nav-inner{max-width:520px;margin:0 auto;display:flex}
.nav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:#6b6b6b;font-size:11px;font-weight:500}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600}
.nav svg{width:22px;height:22px}

.center{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.demo-banner{background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;text-align:center;padding:8px 16px;color:var(--muted)}

/* Admin */
.admin{max-width:760px;margin:0 auto;padding:32px 20px 80px}
.admin h1{font-size:34px}
.admin .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.admin fieldset{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;display:flex;flex-direction:column;gap:10px}
.admin legend{font-weight:600;font-size:14px;padding:0 6px}
.admin .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.admin .toolbar .btn{width:auto}
.admin .list a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.admin .small{font-size:13px;color:var(--muted)}
@media (max-width:560px){.admin .row{grid-template-columns:1fr}}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.countdown{display:inline-block;margin:14px 0 0;padding:8px 14px;border:1px solid var(--gold);border-radius:999px;font-size:13px;font-weight:600;color:var(--gold-ink)}
.inline-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:500;text-decoration:none}
.inline-link svg{width:16px;height:16px}
.btn svg{width:18px;height:18px}
.info-section{margin-top:30px}
.section-title{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#6b6b6b}
.list-card{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.list-item + .list-item{border-top:1px solid var(--line)}
.list-icon{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--gold-ink)}
.list-icon svg{width:18px;height:18px}
.wx{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.wx-city{margin:0 0 12px;font-family:var(--serif);font-size:22px}
.wx-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wx-day{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.wx-label{font-size:12px;color:#6b6b6b}
.wx-temp{font-size:17px;font-weight:600}
.wx-low{font-size:13px;color:#6b6b6b}
.wx-desc{font-size:10px;color:#6b6b6b;line-height:1.3}
.nav a{font-size:10.5px}

/* ---------- Photos & richer layout ---------- */
.ph{position:relative;overflow:hidden;background:#e9e1d2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.fill{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.62) 100%);pointer-events:none}
.main.flush{padding:0 0 120px}
.pad{padding:0 24px}
.hero{position:relative;height:440px;display:flex;align-items:flex-end;color:#fff;margin-bottom:22px}
.hero.day-hero{height:340px}
.hero-text{position:relative;padding:0 24px 26px;width:100%}
.hero-hi{margin:0 0 6px;font-size:13px;letter-spacing:1px;opacity:.92}
.hero-title{margin:0;color:#fff;font-size:44px;line-height:1.02}
.hero-meta{margin:8px 0 0;font-size:14px;opacity:.92}
.pill{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);font-size:13px;font-weight:600}
.round-back{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.round-back svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;padding:16px 8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat + .stat{border-left:1px solid var(--line)}
.stat strong{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
.stat span{font-size:12px;color:#6b6b6b}
.block{margin-top:30px}
.places{display:flex;gap:12px;overflow-x:auto;margin:0 -24px;padding:2px 24px 6px;scroll-snap-type:x mandatory}
.place{position:relative;flex:0 0 150px;height:200px;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;scroll-snap-align:start;background:#e9e1d2}
.place-text{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:2px}
.place-text strong{font-family:var(--serif);font-size:24px;font-weight:500}
.place-text span{font-size:12px;opacity:.92}
.group + .group{margin-top:18px}
.group-city{margin:0 0 4px;font-family:var(--serif);font-size:22px;color:var(--gold-ink)}
.timeline .day-row{position:relative}
.day-date{font-size:12px;color:#6b6b6b}
.day-body{font-size:16px;line-height:1.7;color:#3d3d3d;margin:0}
.fact-row{flex-direction:row;align-items:flex-start;gap:14px}
.fact-text{display:flex;flex-direction:column;gap:4px}
.fact-text span:first-child{font-size:12px;color:#6b6b6b}
.fact-text span:nth-child(2){font-size:15px;font-weight:500}
.fact-text .inline-link{min-height:36px}

/* Sign in with photo */
.signin2{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.signin-photo{position:relative;height:46vh;min-height:300px}
.signin-mark{position:absolute;left:0;right:0;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.monogram.light{border-color:rgba(255,255,255,.9);color:#fff}
.eyebrow.light{color:#fff}
.signin-sheet{position:relative;margin-top:-22px;background:#fff;border-radius:24px 24px 0 0;padding:34px 28px 40px;flex:1}
.signin-sheet h1{font-size:40px}

/* Brand logo */
.brand-mark{width:72px;height:auto}

/* Day list hotel line */
.day-stay{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b6b6b}
.day-stay svg{width:14px;height:14px;flex-shrink:0}
/* Schedule */
.sched{list-style:none;margin:0;padding:0;border-left:1px solid var(--gold);margin-left:6px}
.sched li{position:relative;display:flex;gap:16px;padding:0 0 18px 20px}
.sched li::before{content:'';position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:1px solid var(--gold)}
.sched-time{flex:0 0 72px;font-size:13px;font-weight:600;color:var(--gold-ink);padding-top:1px}
.sched-text{display:flex;flex-direction:column;gap:3px}
.sched-text strong{font-size:15px;font-weight:500}
.sched-text span{font-size:13px;color:#6b6b6b;line-height:1.5}
.fact-text .fact-sub{font-size:13px;font-weight:400;color:#6b6b6b}
/* Hotels and next trip */
.list-item.hotel .inline-link{min-height:44px;min-width:44px;justify-content:center}
.next-card{display:flex;align-items:center;gap:14px;margin-top:30px;padding:16px;border:1px solid var(--gold);border-radius:16px;text-decoration:none;color:var(--ink);background:var(--soft)}
/* Curated journeys */
.journeys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.journey{position:relative;height:190px;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;background:#e9e1d2}
.journey-text{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:3px}
.journey-text span{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.92}
.journey-text strong{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.05}
.nav a{font-size:10px}

/* ---------- Design polish ---------- */
:root{--shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px rgba(20,20,20,.06)}
.main h1{letter-spacing:-.2px}
.page-eyebrow{margin:0 0 10px}
.section-title{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2.5px;color:#7a7368}
.section-title::before{content:'';width:18px;height:1px;background:var(--gold)}
/* Hero */
.shade{background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,.04) 46%,rgba(0,0,0,.66) 100%)}
.hero-mark{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);width:54px;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.hero{border-radius:0 0 28px 28px;overflow:hidden}
.hero-title{font-size:46px}
.pill{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:500;letter-spacing:.3px}
/* Stats */
.stats{background:#fff;border-color:var(--line);box-shadow:var(--shadow);margin-top:-46px;position:relative;z-index:1;padding:18px 8px}
.stat strong{font-size:34px;color:var(--ink)}
.stat span{letter-spacing:1px;text-transform:uppercase;font-size:10px}
/* Places */
.place{box-shadow:var(--shadow)}
/* Day list */
.group-city{display:flex;align-items:center;gap:12px;font-size:24px;margin-top:6px}
.group-city::after{content:'';flex:1;height:1px;background:var(--line)}
.day-row{min-height:74px}
.day-num{width:38px;height:38px;font-size:19px;color:var(--gold-ink);background:#fff}
.day-row:active{background:var(--soft)}
.day-date{text-transform:uppercase;letter-spacing:1px;font-size:10.5px;color:var(--gold-ink)}
/* Cards */
.list-card,.facts,.paycard,.flight,.wx{box-shadow:var(--shadow);border-color:var(--line)}
.facts{background:#fff}
.list-icon.big{width:48px;height:48px}
.list-icon.big svg{width:22px;height:22px}
/* Flights */
.flight{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}
.flight-route{display:flex;align-items:center;gap:10px}
.flight-end{display:flex;flex-direction:column;gap:2px;min-width:0}
.flight-end.right{text-align:right;align-items:flex-end}
.flight-end strong{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1}
.flight-end span{font-size:12px;color:#6b6b6b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.flight-line{flex:1;display:flex;align-items:center;justify-content:center;position:relative;color:var(--gold-ink)}
.flight-line::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--gold)}
.flight-line svg{position:relative;width:20px;height:20px;background:#fff;padding:0 6px;box-sizing:content-box}
.flight-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:#4a4a4a;line-height:1.5}
/* Advisor */
.advisor{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.advisor-mark{width:56px;height:56px;flex-shrink:0;border-radius:50%;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.advisor-mark img{width:34px;height:auto}
/* Buttons */
.btn{border-radius:14px;letter-spacing:.2px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.98)}
.btn:not(.ghost){background:#141414}
/* Bottom nav */
.nav{background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid rgba(0,0,0,.06)}
.nav a{position:relative;color:#8a8a8a;font-weight:500}
.nav a[aria-current="page"]{color:var(--gold-ink);font-weight:600}
.nav a[aria-current="page"]::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:22px;height:2px;border-radius:2px;background:var(--gold)}
/* Journeys */
.journey{box-shadow:var(--shadow);height:200px}
.next-card{box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.hero:not(.day-hero) .hero-text{padding-bottom:66px}

/* ---------- Readability ---------- */
:root{--muted:#4a4a4a;--gold-ink:#7d5c1f}
body{font-size:16px}
.muted{font-size:15px;color:#4a4a4a;line-height:1.6}
.muted.small,.list-item .muted{font-size:14px !important;color:#4f4f4f}
.note{font-size:14px;color:#4a4a4a}
.hint{margin:-6px 0 0;font-size:14px;color:#4f4f4f;line-height:1.5}
label{font-size:14px;font-weight:600;color:#222}
.eyebrow{font-size:12px;letter-spacing:3px;font-weight:600}
.section-title{font-size:12.5px;letter-spacing:2px;color:#3f3f3f;font-weight:700}
.day-title{font-size:16.5px;font-weight:600}
.day-date{font-size:12px;font-weight:600;letter-spacing:.8px}
.day-stay{font-size:13.5px;color:#4f4f4f}
.day-body{font-size:17px;color:#2b2b2b;line-height:1.7}
.stat span{font-size:11.5px;color:#4a4a4a;font-weight:600}
.hero-hi{font-size:15px;opacity:1;font-weight:500}
.hero-meta{font-size:15.5px;opacity:1}
.hero-text{text-shadow:0 1px 12px rgba(0,0,0,.45)}
.shade{background:linear-gradient(180deg,rgba(0,0,0,.40) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,.08) 44%,rgba(0,0,0,.78) 100%)}
.place-text,.journey-text{text-shadow:0 1px 10px rgba(0,0,0,.5)}
.place-text span,.journey-text span{font-size:13px;opacity:1;font-weight:500}
.journey .shade,.place .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.8) 100%)}
.sched-time{font-size:14.5px;flex-basis:78px}
.sched-text strong{font-size:16.5px;font-weight:600}
.sched-text span{font-size:14.5px;color:#4a4a4a}
.tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:#f3ead8;color:#6d4f17;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.5px;vertical-align:2px}
.fact span:first-child,.fact-text span:first-child{font-size:13px;color:#4a4a4a;font-weight:600}
.fact-text span:nth-child(2){font-size:16.5px;font-weight:600}
.fact-text .fact-sub{font-size:14.5px;color:#4a4a4a}
.flight-end span{font-size:13.5px;color:#4a4a4a}
.flight-meta{font-size:14.5px;color:#2f2f2f}
.wx-label,.wx-low{font-size:13px;color:#4a4a4a}
.wx-desc{font-size:11.5px;color:#4a4a4a}
.nav a{font-size:11.5px;color:#5a5a5a}
.nav svg{width:24px;height:24px}
.btn{font-size:16px}
input,textarea,select{font-size:17px;border-color:#c9c2b5}
/* Auth */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:72px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:44px;min-width:56px;border:0;background:none;color:var(--gold-ink);font-weight:600;font-size:14px;cursor:pointer}
.code-input{letter-spacing:8px;font-size:24px;text-align:center}
.link-btn{display:block;margin:14px auto 0;min-height:44px;border:0;background:none;color:var(--gold-ink);font-weight:600;font-size:15px;cursor:pointer}
.auth-switch{display:flex;flex-direction:column;gap:10px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line);text-align:center;font-size:15px;color:#4a4a4a}

.note:empty,.error:empty{display:none}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.quick-btn svg{width:22px;height:22px;color:var(--gold-ink)}
.quick-btn strong{font-weight:700}
[id^="sec-"]{scroll-margin-top:16px}

/* ---------- Icons ---------- */
.quick-btn svg,.list-icon svg{stroke-width:1.6}
.list-icon{background:#f6f0e4}
/* ---------- Trip progress ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.day-row.done .day-num{background:#f6f0e4;border-color:#e2d3b3;color:var(--gold-ink)}
.day-row.done .day-num svg{width:18px;height:18px;stroke-width:2.2}
.day-row.done .day-title{color:#555}
.day-row.today{background:linear-gradient(90deg,#fbf6ec,#fff);border-radius:12px;padding-left:8px;margin-left:-8px}
.day-row.today .day-num{background:var(--gold);border-color:var(--gold);color:#fff}
.today-tag{background:var(--gold);color:#fff}
.now-tag{background:#1f6b45;color:#fff}
.sched li.done .sched-text strong{color:#666}
.sched li.done::before{background:var(--gold);border-color:var(--gold)}
.sched li.now::before{background:#1f6b45;border-color:#1f6b45;box-shadow:0 0 0 4px rgba(31,107,69,.18)}
.today-card{display:flex;flex-direction:column;gap:6px;margin-top:18px;padding:18px;border-radius:18px;background:#141414;color:#fff;text-decoration:none;box-shadow:var(--shadow)}
.today-eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#e6cf9d;font-weight:600}
.today-card strong{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.1}
.today-line{display:flex;align-items:center;gap:8px;font-size:15px;color:#f1f1f1}
.today-line svg{width:18px;height:18px;flex-shrink:0;color:#e6cf9d}
.today-go{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:14px;font-weight:600;color:#e6cf9d}
.today-go svg{width:16px;height:16px}
/* ---------- Review ---------- */
.review-card{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:20px;border:1px solid var(--gold);border-radius:18px;background:#fbf6ec;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.review-card strong{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.1}
.review-card > span:not(.btn):not(.review-stars){font-size:15px;color:#3f3f3f;line-height:1.55}
.review-card .btn{margin-top:6px}
.review-stars{display:flex;gap:4px;color:var(--gold)}
.review-stars svg{width:20px;height:20px;fill:var(--gold)}
.field-label{font-size:14px;font-weight:600;color:#222}
.stars{display:flex;gap:6px}
.star{width:52px;height:52px;border:0;background:none;padding:6px;color:#c9c2b5;cursor:pointer}
.star svg{width:100%;height:100%}
.star.on{color:var(--gold)}
.star.on svg{fill:var(--gold)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.add-photos{cursor:pointer}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;font-weight:400;color:#3f3f3f;line-height:1.5}
.check input{width:22px;height:22px;min-height:0;margin:1px 0 0;flex-shrink:0;accent-color:var(--gold-ink)}
.thanks{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding-top:20px}
/* ---------- Preview banner ---------- */
.demo-banner{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#3f3f3f}
.demo-banner button{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid #d9d4ca;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.demo-banner button[aria-pressed="true"]{background:#141414;color:#fff;border-color:#141414}

.review-row{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.review-row p{margin:4px 0 0;line-height:1.55}
.review-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.review-photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}

/* ---------- Weather icons ---------- */
.wx-row{gap:4px}
.wx-day{gap:4px}
.wx-icon{width:44px;height:44px;margin:2px 0}
.wx-label{font-weight:600}
.wx-temp{font-size:18px}
.wx-desc{font-size:12px;font-weight:500}

/* ---------- Sign-in logo ---------- */
.signin-photo .shade{background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.30) 45%,rgba(0,0,0,.70) 100%)}
.signin-mark{top:calc(50% - 11px);bottom:auto;transform:translateY(-50%);z-index:1}
.signin-sheet{z-index:2}

/* ---------- Motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.0}to{transform:none;opacity:1}}
@keyframes logoIn{from{opacity:0;transform:translateY(calc(-50% + 12px)) scale(.94)}to{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,207,157,.7)}70%{box-shadow:0 0 0 10px rgba(230,207,157,0)}100%{box-shadow:0 0 0 0 rgba(230,207,157,0)}}
@keyframes navDot{from{width:0;opacity:0}to{width:22px;opacity:1}}
@keyframes wxSpin{to{transform:rotate(360deg)}}
@keyframes wxDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes wxDrop{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
@keyframes wxFlash{0%,88%,100%{opacity:1}92%{opacity:.25}}

.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.ph{background:linear-gradient(90deg,#ebe4d6 0%,#f5f0e6 50%,#ebe4d6 100%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.ph.loaded{animation:none;background:#e9e1d2}
.ph img{opacity:0;transition:opacity .7s ease}
.ph.loaded img{opacity:1}
.hero .ph img,.signin-photo .ph img{animation:kenburns 7s cubic-bezier(.2,.6,.2,1) both}
.hero-text,.hero-mark{animation:rise .8s .15s cubic-bezier(.2,.7,.2,1) both}
.signin-sheet{animation:sheetUp .7s cubic-bezier(.2,.7,.2,1) both}
.signin-mark{animation:logoIn .9s .1s cubic-bezier(.2,.7,.2,1) both}
.place,.journey,.quick-btn,.list-item,.day-row,.next-card,.today-card,.review-card,.trip-card,.flight{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}
.place:active,.journey:active,.quick-btn:active,.next-card:active,.today-card:active,.review-card:active,.trip-card:active{transform:scale(.97)}
@media (hover:hover){.place:hover,.journey:hover,.quick-btn:hover,.next-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,20,20,.12)}}
.place .ph img,.journey .ph img{transition:opacity .7s ease,transform .6s ease}
@media (hover:hover){.place:hover .ph img,.journey:hover .ph img{transform:scale(1.06)}}
.nav a svg{transition:transform .2s ease}
.nav a:active svg{transform:scale(.88)}
.nav a[aria-current="page"] svg{animation:pop .4s ease}
.nav a[aria-current="page"]::before{animation:navDot .35s ease both}
.today-eyebrow::before{content:'';display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#e6cf9d;vertical-align:1px;animation:pulse 2s infinite}
.sched li.now::before{animation:pulse 2s infinite}
.star.on svg{animation:pop .35s ease}
.wx-spin{animation:wxSpin 18s linear infinite}
.wx-drift{animation:wxDrift 4s ease-in-out infinite}
.wx-drop{animation:wxDrop 1.4s ease-in infinite}
.wx-flash{animation:wxFlash 3s infinite}
.review-stars svg{animation:pop .5s ease both}
.review-stars svg:nth-child(2){animation-delay:.08s}.review-stars svg:nth-child(3){animation-delay:.16s}.review-stars svg:nth-child(4){animation-delay:.24s}.review-stars svg:nth-child(5){animation-delay:.32s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .ph img{opacity:1}
}

/* ---------- Sign-in logo: no dark halo ---------- */
.signin-photo .shade{background:linear-gradient(180deg,rgba(0,0,0,.20) 0%,rgba(0,0,0,.26) 50%,rgba(0,0,0,.50) 100%)}

/* ---------- Loader: the swoosh draws itself as the plane flies (colours exactly as the logo, on black) ---------- */
.loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;animation:fadeIn .35s ease both}
.loader-mark{position:relative;width:150px}
.loader-svg{display:block;width:150px;height:auto;overflow:visible}
.loader-word{display:block;width:min(294px,78vw);height:auto;margin-top:26px;animation:fadeIn 1s .2s ease both}
.loader-bar{position:relative;width:110px;height:2px;margin-top:34px;border-radius:2px;background:rgba(212,175,92,.22);overflow:hidden;animation:fadeIn .8s .5s ease both}
.loader-bar::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:2px;background:linear-gradient(90deg,rgba(226,192,110,0),#e2c06e,rgba(226,192,110,0));animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{to{left:100%}}

/* ---------- Day cards ---------- */
.tap-hint{display:flex;align-items:center;gap:8px;margin:-2px 0 14px;color:#5a5a5a}
.tap-hint svg{width:18px;height:18px;color:var(--gold-ink);flex-shrink:0}
.days{gap:10px}
.day-row.day-card{padding:14px 14px;border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);margin:0}
.day-row.day-card.today{background:linear-gradient(90deg,#fbf3e2,#fff);border-color:#e6cf9d;margin:0;padding-left:14px}
.day-row.day-card.done{background:#fcfbf8}
.day-plans{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold-ink);font-weight:600}
.day-plans svg{width:14px;height:14px}
.day-go{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:#f6f0e4;color:var(--gold-ink);display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease}
.day-go svg{width:18px;height:18px;stroke-width:2.2}
.day-card:active .day-go{transform:translateX(3px)}
@media (hover:hover){.day-card:hover .day-go{background:var(--gold);color:#fff;transform:translateX(3px)}}
.group + .group{margin-top:22px}
.group-city{margin-bottom:10px}

/* ---------- Activity contacts ---------- */
.sched-contact{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:14px;font-weight:600;color:#2f2f2f}
.mini-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid #d9cdb4;border-radius:999px;background:#fff;color:var(--gold-ink);font-size:14px;font-weight:600;text-decoration:none}
.mini-btn svg{width:16px;height:16px}

/* ---------- Weather ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -24px 14px;padding:2px 24px}
.chip{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #d9d4ca;background:#fff;font-size:14px;font-weight:600;color:#3f3f3f;cursor:pointer;transition:background .2s ease,color .2s ease}
.chip[aria-selected="true"]{background:#141414;border-color:#141414;color:#fff}
.wx-card{border-radius:22px;padding:20px;background:linear-gradient(160deg,#eef3f8,#fff 70%);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise .5s ease both}
.wx-card.wx-clear{background:linear-gradient(160deg,#fff1cf,#fffaf0 55%,#fff)}
.wx-card.wx-partly{background:linear-gradient(160deg,#fdf0d6,#eef3f8 60%,#fff)}
.wx-card.wx-showers,.wx-card.wx-rain,.wx-card.wx-drizzle{background:linear-gradient(160deg,#dde9f6,#f2f6fb 60%,#fff)}
.wx-card.wx-storm{background:linear-gradient(160deg,#d6dbe5,#eef1f6 60%,#fff)}
.wx-card.wx-snow{background:linear-gradient(160deg,#e6f1fb,#f7fbff 60%,#fff)}
.wx-card.wx-fog,.wx-card.wx-cloudy{background:linear-gradient(160deg,#e7ebf0,#f6f8fa 60%,#fff)}
.wx-now{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,.07)}
.wx-now p{margin:0}
.wx-city{font-family:var(--serif);font-size:26px;margin:0}
.wx-big{font-family:var(--serif);font-size:58px;line-height:1;margin-top:4px !important}
.wx-sum{font-size:15px;color:#3f3f3f;margin-top:6px !important}
.wx-icon.big{width:96px;height:96px;flex-shrink:0}
.wx-list{list-style:none;margin:6px 0 0;padding:0}
.wx-list li{display:grid;grid-template-columns:52px 36px 1fr 34px 64px 34px;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid rgba(0,0,0,.05)}
.wx-list li:last-child{border-bottom:0}
.wx-list .wx-icon{width:34px;height:34px;margin:0}
.wx-list .wx-label{font-size:15px;font-weight:600;color:#222}
.wx-list .wx-desc{font-size:13.5px;color:#4a4a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-list .wx-low{font-size:15px;color:#6a6a6a;text-align:right}
.wx-list .wx-temp{font-size:15px;font-weight:700;color:#141414}
.wx-bar{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.08)}
.wx-bar span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7fb6e8,#f2c25a)}
@media (max-width:360px){.wx-list li{grid-template-columns:46px 32px 1fr 30px 44px 30px}}

/* ---------- Sign-in logo (animated once) ---------- */
.signin-mark{gap:14px}
.signin-svg,.signin-mk{display:block;width:104px;height:auto;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.signin-word{display:block;width:204px;height:auto;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45));animation:fadeIn .9s .3s ease both}

/* ---------- Account footer and delete account ---------- */
.account-foot { display: flex; flex-direction: column; gap: 14px; }
.account-links { display: flex; justify-content: center; gap: 22px; font-size: 13px; }
.account-links a { color: var(--muted, #7a7a7a); text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { background: #a3302a; border-color: #a3302a; color: #fff; }
.btn.danger:disabled { opacity: .6; }

/* Home without a trip, guest explore, sample trip */
.home-mark{display:block;width:58px;height:auto;margin:4px 0 18px}
.home-status{display:flex;gap:14px;align-items:flex-start;margin-top:20px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}
.home-status svg{width:22px;height:22px;flex-shrink:0;color:var(--gold-ink);margin-top:2px}
.home-status > span{display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.55;color:#3f3f3f}
.home-status strong{font-size:15px;color:var(--ink)}
.sample-card{position:relative;display:block;height:230px;margin-top:22px;border-radius:20px;overflow:hidden;text-decoration:none;color:#fff;background:#141414;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.sample-card:active{transform:scale(.985)}
.sample-card .shade{background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.82) 100%)}
.sample-card-text{position:absolute;left:18px;right:18px;bottom:16px;display:flex;flex-direction:column;gap:5px;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.sample-card-text > span:first-child{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:#f3dfaa}
.sample-card-text strong{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.05}
.sample-go{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:13px;font-weight:600}
.sample-go svg{width:16px;height:16px}
.sample-banner{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#141414;color:#fff;font-size:13px}
.sample-banner strong{color:#f3dfaa;font-weight:600}
.sample-banner a{flex-shrink:0;padding:6px 14px;border:1px solid rgba(243,223,170,.6);border-radius:999px;color:#f3dfaa;text-decoration:none;font-weight:600;font-size:12.5px}

/* No upcoming trip: empty itinerary, previous travels */
.boot{min-height:100vh;background:#fff}
.pill-cta{background:#fff!important;color:#141414!important;border-color:#fff!important;font-weight:600!important;text-decoration:none;padding:10px 20px;text-shadow:none}
.empty-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.empty-card > strong{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1;margin-top:4px}
.empty-card > span:not(.list-icon){font-size:14.5px;line-height:1.55;color:#4a4a4a}
.empty-card .stack{width:100%}
.empty-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:14px;font-weight:600;color:var(--gold-ink);text-decoration:none}
.empty-link svg{width:16px;height:16px}
.past-card{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);background:#fff;box-shadow:var(--shadow)}
.past-ph{position:relative;width:76px;height:76px;flex-shrink:0;border-radius:12px;overflow:hidden;background:#e9e1d2}
.past-ph img{width:100%;height:100%;object-fit:cover}
.past-tag{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:600;color:#3d7a4f}
.past-tag svg{width:14px;height:14px}
